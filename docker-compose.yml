# ─────────────────────────────────────────────────────────────────────────────
# BEFORE STARTING: edit the config files below to match your environment.
#
#  CDI simulator:
#    devices_config.yaml          → 6-device fleet, proto v1
#    devices_config_1device.yaml  → single device, proto v2 (swap the volume
#                                   mount below if you want to use this one)
#    In whichever file you use, set server.host to your CDI gRPC server IP/hostname.
#    The compose command uses --insecure so TLS config in the YAML is ignored.
#
#  EMR simulator:
#    simulator/config/emr_config.yaml → set api_base_url to your OpenEMR server.
#    Set OPENEMR_ACCESS_TOKEN in a .env file (copy .env.example) if auth is required.
# ─────────────────────────────────────────────────────────────────────────────

services:
  cdi-fleet:
    build:
      context: .
      dockerfile: Dockerfile
    image: cdi-fleet-simulator:latest
    container_name: cdi-fleet-sim
    command: ["--insecure", "--control-port", "8090", "--no-persist"]
    ports:
      - "8090:8090"
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/fleet/summary', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 25s
    volumes:
      # Default: 6-device fleet (proto v1).
      # To use single-device proto v2 config instead, replace the line below with:
      #   - ./devices_config_1device.yaml:/app/devices_config.yaml:ro
      - ./devices_config.yaml:/app/devices_config.yaml:ro

  emr-sim:
    build:
      context: .
      dockerfile: Dockerfile
    image: cdi-fleet-simulator:latest
    container_name: emr-sim
    entrypoint: ["python", "run_emr_service.py"]
    command:
      [
        "--config-dir",
        "/app/simulator/config",
        "--ui-port",
        "3001",
        "--auto-start",
      ]
    ports:
      - "3001:3001"
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/api/emr/devices', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 25s
    environment:
      OPENEMR_ACCESS_TOKEN: "${OPENEMR_ACCESS_TOKEN:-}"
    volumes:
      - ./simulator/config:/app/simulator/config:ro
