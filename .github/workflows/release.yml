name: Publish Release

on:
  push:
    branches:
      - "*"
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build (example: main)"
        required: true
        default: "main"

permissions:
  contents: write

jobs:
  build-windows-asset:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_fleet.txt pyinstaller

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm fleet_simulator.spec

      - name: Build hemodynamic simulator executable
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm `
            --name hemodynamic_simulator `
            --onedir `
            --paths . `
            --add-data "fleet_sim/templates/emr_control_panel.html;fleet_sim/templates" `
            run_emr_service.py

      - name: Create release package
        id: package
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $version = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -ne "tag") {
            $version = "$version-$sha"
          }
          # Sanitize names so branch refs like feature/x do not create nested paths.
          $version = $version -replace '[\\/:*?"<>|]', '-'
          $packageDir = "CDICore-Simulator-Suite-$version-Windows"
          if (Test-Path $packageDir) { Remove-Item -Recurse -Force $packageDir }
          New-Item -ItemType Directory -Path $packageDir | Out-Null
          New-Item -ItemType Directory -Path "$packageDir\fleet_simulator" -Force | Out-Null
          Copy-Item "dist\fleet_simulator\*" "$packageDir\fleet_simulator" -Recurse -Force
          if (Test-Path "dist\fleet_simulator\fleet_simulator.exe") {
            Copy-Item "dist\fleet_simulator\fleet_simulator.exe" "$packageDir\fleet_simulator.exe" -Force
          }
          if (Test-Path "dist\hemodynamic_simulator") {
            New-Item -ItemType Directory -Path "$packageDir\hemodynamic_simulator" -Force | Out-Null
            Copy-Item "dist\hemodynamic_simulator\*" "$packageDir\hemodynamic_simulator" -Recurse -Force
            if (Test-Path "dist\hemodynamic_simulator\hemodynamic_simulator.exe") {
              Copy-Item "dist\hemodynamic_simulator\hemodynamic_simulator.exe" "$packageDir\hemodynamic_simulator.exe" -Force
            }
          }
          Copy-Item "devices_config.yaml" $packageDir -Force
          New-Item -ItemType Directory -Path "$packageDir\simulator\config" -Force | Out-Null

          $hasDocumentedConfig = Test-Path "simulator\config\emr_config.yaml.documented"
          Get-ChildItem "simulator\config" -File | Where-Object {
            $_.Name -like "*.yaml" -or $_.Name -like "*.yaml.documented"
          } | ForEach-Object {
            if ($hasDocumentedConfig -and $_.Name -eq "emr_config.yaml") {
              return
            }
            Copy-Item $_.FullName "$packageDir\simulator\config\$($_.Name)" -Force
          }

          if ($hasDocumentedConfig) {
            # Ship the documented template as runtime config name to avoid releasing real secrets.
            Copy-Item "simulator\config\emr_config.yaml.documented" "$packageDir\simulator\config\emr_config.yaml" -Force
          }
          if (Test-Path ".env.example") { Copy-Item ".env.example" "$packageDir\.env" -Force }
          if (Test-Path "CONFIG_USAGE_GUIDE.md") { Copy-Item "CONFIG_USAGE_GUIDE.md" $packageDir -Force }
          Copy-Item "README.md" $packageDir -Force
          Copy-Item "FLEET_SIMULATOR_SUMMARY.md" $packageDir -Force
          if (Test-Path "HEMODYNAMIC_SIMULATOR_SUMMARY.md") { Copy-Item "HEMODYNAMIC_SIMULATOR_SUMMARY.md" $packageDir -Force }
          if (Test-Path "FLEET_IMPROVEMENTS_v2.md") { Copy-Item "FLEET_IMPROVEMENTS_v2.md" $packageDir -Force }
          $notesFile = "RELEASE_NOTES_$version.md"
          if (Test-Path $notesFile) { Copy-Item $notesFile $packageDir -Force }
          $zipPath = "$packageDir.zip"
          Compress-Archive -Path "$packageDir\*" -DestinationPath $zipPath -Force
          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload packaged zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-zip
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs: build-windows-asset
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download packaged zip
        uses: actions/download-artifact@v4
        with:
          name: windows-release-zip
          path: release-assets

      - name: Resolve release notes
        id: notes
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          notes_file="RELEASE_NOTES_${tag}.md"

          if [[ -f "$notes_file" ]]; then
            echo "Using $notes_file"
            {
              echo 'body<<EOF'
              cat "$notes_file"
              echo
              echo EOF
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo 'body<<EOF'
              echo "# ${tag}"
              echo
              echo "Release created from tag ${tag}."
              echo EOF
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CDICore Simulator Suite - ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            release-assets/*.zip
          draft: false
          prerelease: false
