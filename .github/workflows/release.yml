name: Publish Release

on:
  push:
    branches:
      - "*"
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build (example: feature/Hemodynamic-Simulator)"
        required: false
        default: "feature/Hemodynamic-Simulator"

permissions:
  contents: write

jobs:
  build-windows-asset:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Show build source
        shell: pwsh
        run: |
          Write-Host "Trigger ref: ${{ github.ref }}"
          Write-Host "Ref type: ${{ github.ref_type }}"
          Write-Host "Requested build ref: ${{ github.event.inputs.ref }}"
          Write-Host "Checked out branch: $(git branch --show-current)"
          Write-Host "Checked out commit: $(git rev-parse HEAD)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_fleet.txt pyinstaller

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm fleet_simulator.spec

      - name: Build hemodynamic simulator executable
        shell: pwsh
        run: |
          $entryScript = $null
          if (Test-Path "run_emr_service.py") { $entryScript = "run_emr_service.py" }
          elseif (Test-Path "simulator/main.py") { $entryScript = "simulator/main.py" }

          if (-not $entryScript) {
            Write-Host "::warning::Hemodynamic entry script not found (run_emr_service.py / simulator/main.py). Skipping hemodynamic build."
            exit 0
          }

          Write-Host "Building hemodynamic simulator from $entryScript"
          $addData = @()
          if (Test-Path "fleet_sim/templates/emr_control_panel.html") {
            $addData = @("--add-data", "fleet_sim/templates/emr_control_panel.html;fleet_sim/templates")
          }
          if (Test-Path "simulator/config") {
            $addData += @("--add-data", "simulator/config;simulator/config")
          }
          pyinstaller --clean --noconfirm --name hemodynamic_simulator --onedir --paths . @addData $entryScript

      - name: Create release package
        id: package
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $version = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -ne "tag") {
            $version = "$version-$sha"
          }
          # Sanitize names so branch refs like feature/x do not create nested paths.
          $version = $version -replace '[\\/:*?"<>|]', '-'
          $packageDir = "CDICore-Simulator-Suite-Windows"
          if (Test-Path $packageDir) { Remove-Item -Recurse -Force $packageDir }
          New-Item -ItemType Directory -Path $packageDir | Out-Null
          New-Item -ItemType Directory -Path "$packageDir\fleet_simulator" -Force | Out-Null
          Copy-Item "dist\fleet_simulator\*" "$packageDir\fleet_simulator" -Recurse -Force
          if (Test-Path "dist\hemodynamic_simulator") {
            New-Item -ItemType Directory -Path "$packageDir\hemodynamic_simulator" -Force | Out-Null
            Copy-Item "dist\hemodynamic_simulator\*" "$packageDir\hemodynamic_simulator" -Recurse -Force
          }
          Copy-Item "devices_config.yaml" $packageDir -Force
          New-Item -ItemType Directory -Path "$packageDir\simulator\config" -Force | Out-Null

          # Ship only the single emr_config.yaml (use documented template if available to avoid secrets).
          if (Test-Path "simulator\config\emr_config.yaml.documented") {
            Copy-Item "simulator\config\emr_config.yaml.documented" "$packageDir\simulator\config\emr_config.yaml" -Force
          }
          elseif (Test-Path "simulator\config\emr_config.yaml") {
            Copy-Item "simulator\config\emr_config.yaml" "$packageDir\simulator\config\emr_config.yaml" -Force
          }
          if (Test-Path ".env.example") { Copy-Item ".env.example" "$packageDir\.env" -Force }
          Copy-Item "README.md" $packageDir -Force
          $notesFile = "RELEASE_NOTES_$version.md"
          if (Test-Path $notesFile) { Copy-Item $notesFile $packageDir -Force }
          $zipPath = "$packageDir.zip"
          Compress-Archive -Path "$packageDir\*" -DestinationPath $zipPath -Force
          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload packaged zip
        uses: actions/upload-artifact@v4
        with:
          name: CDI-Core-EMR-Simulator-Suite-Windows
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs: build-windows-asset
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download packaged zip
        uses: actions/download-artifact@v4
        with:
          name: CDI-Core-EMR-Simulator-Suite-Windows
          path: release-assets

      - name: Resolve release notes
        id: notes
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          notes_file="RELEASE_NOTES_${tag}.md"

          if [[ -f "$notes_file" ]]; then
            echo "Using $notes_file"
            {
              echo 'body<<EOF'
              cat "$notes_file"
              echo
              echo EOF
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo 'body<<EOF'
              echo "# ${tag}"
              echo
              echo "Release created from tag ${tag}."
              echo EOF
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CDICore Simulator Suite - ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            release-assets/*.zip
          draft: false
          prerelease: false
