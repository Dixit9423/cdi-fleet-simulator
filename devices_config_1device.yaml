# ═══════════════════════════════════════════════════════════════════════════════
# DEVICES  —  6 simulated CDI Core devices
# ═══════════════════════════════════════════════════════════════════════════════
# Fields:
#   serial           → Core serial number (CDI-<serial> = device_id)
#   sw_version       → software version string
#   site             → location label (informational)
#   initial_state    → MEASURING | IDLE | STANDBY  (state after announcement)
#   patient_id       → patient bound at startup (null = no patient)
#   profile          → profile name from `profiles` section (null = no profile)
#   probes           → map of personality → serial (for source_device_id)
#   tick_data        → param_id → [value1, value2, ...] cycling list
#                      Only needed for MEASURING devices; values are strings.
# ─────────────────────────────────────────────────────────────────────────────
devices:
  # ── Device 1: Full Bypass Surgery (default IDLE) ────────────────────────
  - serial: "C1234567"
    sw_version: "1.0.0"
    site: "OR-1"
    initial_state: "IDLE"
    patient_id: null
    profile: null
    probes:
      "Arterial BPM": "B0050034"
      "Venous BPM": "V1234567"
      "Arterial H/SAT": "H0050026"
      "Venous H/SAT": "VH123456"
      "Flow Sensor Red": "F-R12345"
      "Cerebral Oximeter Ch1": "C1234567"
      "Core Calculated": "CDICore0001"
    tick_data:
      # ── Core Calculated ──────────────────────────────────────────────────
      # 76: BE (mEq/L) — near-normal base excess on bypass
      76: ["1.5", "1.2", "1.8", "1.3", "1.6", "1.4"]
      # 70: VO2 (mL/min) — oxygen consumption reduced under hypothermia
      70: ["215", "218", "212", "220", "216", "214"]
      # 74: VO2I (mL/min/m2) — indexed VO2
      74: ["128", "130", "126", "132", "129", "127"]
      # 71: DO2 (mL/min) — oxygen delivery via bypass oxygenator
      71: ["468", "472", "465", "475", "470", "466"]
      # 75: DO2I (mL/min/m2) — indexed DO2; "276" triggers alarm low (threshold 280)
      75: ["298", "302", "276", "295", "305", "300", "296"]
      # 73: O2ER (%) — "42" triggers alarm high (limit 40)
      73: ["27", "28", "26", "42", "29", "27", "28"]
      # ── Arterial BPM ────────────────────────────────────────────────────
      # 9: HCO3 (mEq/L) — "53.0" outside display range (max 40) and operating range (max 50)
      9: ["22.8", "22.5", "23.1", "53.0", "22.6", "22.9", "22.7"]
      # 2: pH — arterial; "7.285" triggers alarm low (limit 7.30)
      2: ["7.418", "7.415", "7.285", "7.421", "7.416", "7.420", "7.417"]
      # 4: pCO2 Arterial (mmHg) — normocarbia on bypass
      4: ["40.2", "39.8", "40.5", "40.0", "39.6", "40.4"]
      # 6: pO2 Arterial (mmHg) — "815.0" outside display and operating range (max 800)
      6: ["285.0", "290.0", "815.0", "280.0", "295.0", "282.0", "288.0"]
      # 10: K+ (mmol/L) — potassium, normal
      10: ["4.2", "4.1", "4.3", "4.2", "4.0", "4.3"]
      # 8: SO2 Calc Arterial (%) — "88.0" triggers alarm low (limit 90)
      8: ["98.5", "98.3", "88.0", "98.7", "98.4", "98.6", "98.2"]
      # 11: S. Temp (°C) — within alarm range 34–38°C
      11: ["35.5", "35.2", "35.8", "35.4", "35.6", "35.3"]
      # ── Venous BPM ──────────────────────────────────────────────────────
      # 18: pCO2 Venous (mmHg) — venous CO2, slightly above arterial
      18: ["46.5", "46.0", "47.0", "46.2", "46.8", "45.8"]
      # ── Arterial H/SAT ──────────────────────────────────────────────────
      # 41: HCT Arterial (%) — hemodilution on bypass
      41: ["28.5", "28.2", "28.8", "28.4", "28.6", "28.3"]
      # 42: Hgb Arterial (g/dL) — consistent with hemodiluted HCT
      42: ["9.8", "9.6", "10.0", "9.7", "9.9", "9.5"]
      # 43: SO2 Arterial H/SAT (%) — high, matches Calc SO2
      43: ["98.2", "98.0", "98.4", "98.1", "98.3", "97.9"]
      # ── Venous H/SAT ────────────────────────────────────────────────────
      # 48: HCT Venous (%) — slightly lower than arterial
      48: ["27.5", "27.2", "27.8", "27.4", "27.6", "27.3"]
      # 49: Hgb Venous (g/dL)
      49: ["9.2", "9.0", "9.4", "9.1", "9.3", "8.9"]
      # ── Hemodynamics ────────────────────────────────────────────────────
      # 101: MAP (mmHg) — within operating range 70–100 mmHg
      101: ["74", "72", "76", "73", "75", "71"]
      # ── HLM / ECMO ──────────────────────────────────────────────────────
      # 106: Arterial_Flow (L/min) — pump flow rate
      106: ["4.5", "4.6", "4.4", "4.5", "4.7", "4.3"]
      # 108: FiO2 (%) — oxygen fraction to oxygenator
      108: ["80", "82", "78", "80", "84", "76"]
